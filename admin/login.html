<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Ingreso · SGP Seguros</title>
  <link rel="icon" href="/img/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,800&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-pagina">
  <div class="login">
    <div class="login-cab">
      <img src="/img/logo.png" alt="">
      <div><h2>Panel SGP Seguros</h2><p class="nota" style="color:#4cc3d2">Agenda, mensajes y contenido</p></div>
    </div>
    <div class="franja"></div>
    <form id="form-login" novalidate>
      <label class="campo" for="usuario"><span>Usuario</span><input id="usuario" name="usuario" autocomplete="username" required></label>
      <label class="campo" for="clave"><span>Clave</span><input id="clave" name="clave" type="password" autocomplete="current-password" required></label>
      <p class="alerta" id="error" role="alert" hidden></p>
      <button class="btn btn-primario" type="submit" style="width:100%;margin-top:6px">Entrar</button>
      <p class="nota" style="margin-top:14px"><a href="/">← Volver al sitio</a></p>
    </form>
  </div>
  <script src="/admin/login.js"></script>
</body>
</html>
